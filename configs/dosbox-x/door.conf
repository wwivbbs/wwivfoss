# WWIVFOSS door template for DOSBox-X.  UNTESTED.
#
# The BBS fills in the @...@ placeholders, listens on 127.0.0.1:@PORT@
# (WWIV: listen-socket exec mode, %Z), and runs:
#
#   dosbox-x -conf door.conf -nogui -silent
#
# DOSBox-X connects COM1 to the BBS. Check whether your build raises DCD on
# connect; if FOSTEST reports "carrier lost" immediately, add -C to the
# WWIVFOSS line below.

[cpu]
cycles = max

[serial]
serial1 = nullmodem server:127.0.0.1 port:@PORT@ transparent:1

[autoexec]
mount c "@DOS_ROOT@"
mount d "@NODE_DIR@"
c:
cd @DOOR_DIR@
c:\wwivfoss\wwivfoss.exe -P1 @COMMAND@
exit
